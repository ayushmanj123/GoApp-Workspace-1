name: CI — Go

on:
  push:
    branches: [main]
    paths:
      - "packages/shared/go/**"
      - "services/**"
      - "go.work"
      - ".github/workflows/ci-go.yml"
  pull_request:
    branches: [main]
    paths:
      - "packages/shared/go/**"
      - "services/**"
      - "go.work"
      - ".github/workflows/ci-go.yml"

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: |
            packages/shared/go/go.sum
            services/*/go.sum

      - name: Sync workspace
        run: go work sync

      - name: Download dependencies
        run: |
          cd packages/shared/go && go mod download
          for svc in services/*/; do
            (cd "$svc" && go mod download)
          done

      - name: Vet
        run: |
          cd packages/shared/go && go vet ./...
          for svc in services/*/; do
            (cd "$svc" && go vet ./...)
          done

      - name: Test
        run: |
          cd packages/shared/go && go test ./...
          for svc in services/*/; do
            (cd "$svc" && go test ./...)
          done

      - name: Validate phase markers (7.1 / 7.2 / 8.0)
        run: |
          node infrastructure/scripts/validate-phase-7.1.mjs
          node infrastructure/scripts/validate-phase-7.2.mjs
          node infrastructure/scripts/validate-phase-8.0.mjs

      - name: Build services
        run: |
          for svc in services/gateway/ services/metadata/ services/runtime/ services/publish/; do
            echo "Building $svc"
            (cd "$svc" && go build -o /dev/null ./cmd/server)
          done
          # Scaffold stubs still must compile
          for svc in services/auth/ services/connector/ services/environment/ services/audit/ services/search/; do
            echo "Building $svc"
            (cd "$svc" && go build -o /dev/null ./cmd/server)
          done

      - name: Docker build gateway
        run: docker build -f infrastructure/docker/services/gateway/Dockerfile -t goapps-gateway:ci .
