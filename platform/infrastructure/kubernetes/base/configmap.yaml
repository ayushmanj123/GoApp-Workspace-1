apiVersion: v1
kind: ConfigMap
metadata:
  name: goapps-platform-config
  namespace: goapps-platform
  labels:
    app.kubernetes.io/part-of: goapps-platform
data:
  APP_ENV: production
  LOG_LEVEL: info
  AUTH_MODE: keycloak
  # Comma-separated browser origins for Studio/Runtime (required in production; never "*").
  CORS_ALLOW_ORIGINS: https://studio.example.com,https://runtime.example.com
  # Infrastructure endpoints — override per environment via overlays.
  # Credentials live in goapps-platform-secrets (Secret), not here.
  REDIS_URL: redis://redis:6379
  KEYCLOAK_URL: http://keycloak:8080
  KEYCLOAK_REALM: goapps
  KEYCLOAK_CLIENT_ID: goapps-platform
  MINIO_ENDPOINT: minio:9000
  MINIO_PUBLISH_BUCKET: goapps-publish
  MINIO_USE_SSL: "false"
