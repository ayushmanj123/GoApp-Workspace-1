apiVersion: v1
kind: Secret
metadata:
  name: goapps-platform-secrets
  namespace: goapps-platform
  labels:
    app.kubernetes.io/part-of: goapps-platform
type: Opaque
stringData:
  # Replace all values via sealed-secrets / external-secrets / overlay before production use.
  DATABASE_URL: postgres://goapps:CHANGE_ME@postgres:5432/goapps?sslmode=disable
  SECRETS_MASTER_KEY: REPLACE_WITH_32_BYTE_KEY_OR_BASE64
  MINIO_ACCESS_KEY: CHANGE_ME
  MINIO_SECRET_KEY: CHANGE_ME
  KEYCLOAK_CLIENT_SECRET: CHANGE_ME
