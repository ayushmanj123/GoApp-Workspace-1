apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: goapps-platform

# Production deployable surface: edge gateway + core services only.
# Scaffold stubs (auth/connector/environment/audit/search) remain in-repo under
# services/*/ but are intentionally excluded from this base kustomization.
resources:
  - base/namespace.yaml
  - base/configmap.yaml
  - base/secret.yaml
  - services/gateway/deployment.yaml
  - services/gateway/service.yaml
  - services/metadata/deployment.yaml
  - services/metadata/service.yaml
  - services/runtime/deployment.yaml
  - services/runtime/service.yaml
  - services/publish/deployment.yaml
  - services/publish/service.yaml

commonLabels:
  app.kubernetes.io/part-of: goapps-platform
  app.kubernetes.io/managed-by: kustomize
