apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-service
  namespace: goapps-platform
  labels:
    app.kubernetes.io/name: gateway-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gateway-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gateway-service
    spec:
      containers:
        - name: gateway-service
          image: ghcr.io/goapps-platform/gateway-service:latest
          ports:
            - containerPort: 8090
              name: http
          envFrom:
            - configMapRef:
                name: goapps-platform-config
            - secretRef:
                name: goapps-platform-secrets
          env:
            - name: SERVICE_NAME
              value: gateway-service
            - name: PORT
              value: "8090"
            - name: METADATA_SERVICE_URL
              value: http://metadata-service:8082
            - name: PUBLISH_SERVICE_URL
              value: http://publish-service:8085
            - name: RUNTIME_SERVICE_URL
              value: http://runtime-service:8083
          livenessProbe:
            httpGet:
              path: /health
              port: http
          readinessProbe:
            httpGet:
              path: /ready
              port: http
