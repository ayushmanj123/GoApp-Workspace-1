apiVersion: apps/v1
kind: Deployment
metadata:
  name: metadata-service
  namespace: goapps-platform
  labels:
    app.kubernetes.io/name: metadata-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: metadata-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: metadata-service
    spec:
      containers:
        - name: metadata-service
          image: ghcr.io/goapps-platform/metadata-service:latest
          ports:
            - containerPort: 8082
              name: http
          envFrom:
            - configMapRef:
                name: goapps-platform-config
          env:
            - name: SERVICE_NAME
              value: metadata-service
            - name: PORT
              value: "8082"
          livenessProbe:
            httpGet:
              path: /health
              port: http
          readinessProbe:
            httpGet:
              path: /ready
              port: http
