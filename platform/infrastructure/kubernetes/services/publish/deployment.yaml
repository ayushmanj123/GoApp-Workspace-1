apiVersion: apps/v1
kind: Deployment
metadata:
  name: publish-service
  namespace: goapps-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: publish-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: publish-service
    spec:
      containers:
        - name: publish-service
          image: ghcr.io/goapps-platform/publish-service:latest
          ports:
            - containerPort: 8085
              name: http
          envFrom:
            - configMapRef:
                name: goapps-platform-config
            - secretRef:
                name: goapps-platform-secrets
          env:
            - name: SERVICE_NAME
              value: publish-service
            - name: PORT
              value: "8085"
          livenessProbe:
            httpGet:
              path: /health
              port: http
          readinessProbe:
            httpGet:
              path: /ready
              port: http
